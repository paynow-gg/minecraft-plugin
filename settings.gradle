pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = "Neoforge"
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'paynow-minecraft'
include 'paynow-lib'
include 'paynow-bukkit-legacy'
include 'paynow-bukkit-modern'
include 'paynow-bungeecord'
include 'paynow-sponge'
include 'paynow-velocity'
include 'paynow-fabric'
include 'paynow-neoforge'
include 'paynow-folia'