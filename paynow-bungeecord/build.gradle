plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

repositories {
    mavenCentral()
    
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    
    maven {
        url = 'https://libraries.minecraft.net/'
    }
    
    maven {
        url = 'https://maven.elmakers.com/repository/'
    }
}

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.16-R0.4'
    compileOnly 'net.md-5:brigadier:1.0.16-SNAPSHOT'
    shadow(implementation project(":paynow-lib"))
    shadow(implementation 'net.kyori:adventure-platform-bungeecord:4.4.1')
    shadow(implementation 'net.kyori:adventure-text-minimessage:4.21.0')
}

configurations.shadow {
    exclude group: 'com.google.code.gson'
    exclude group: 'org.jetbrains', module: 'annotations'
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate 'net.kyori', 'gg.paynow.libs.kyori'
}

processResources {
    inputs.property "version", project.version

    filesMatching("bungee.yml") {
        expand "version": project.version
    }
}

def targetJavaVersion = 8
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

jar.finalizedBy('shadowJar')
